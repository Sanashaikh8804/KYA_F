<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KYA-Shield Mock Bank</title>
    <style>
      body { font: 16px system-ui, sans-serif; max-width: 760px; margin: 3rem auto; padding: 0 1rem; }
      button { margin: .25rem; padding: .6rem .9rem; }
      #status { white-space: pre-wrap; background: #f3f4f6; padding: 1rem; min-height: 4rem; }
    </style>
  </head>
  <body>
    <h1>KYA-Shield Mock Bank</h1>
    <p>Local-only demo with fake principals. Session: <code id="session"></code></p>
    <button id="balance">View balance</button>
    <button id="external">Load external product content</button>
    <button id="pay">Pay FRESHMART INR 1,180</button>
    <div id="status" aria-live="polite"></div>
    <script>
      const sessionId = `ui-${crypto.randomUUID()}`;
      const principalId = "cust-001";
      document.querySelector("#session").textContent = sessionId;
      const headers = {"X-Session-ID": sessionId, "Content-Type": "application/json"};
      async function send(path, options = {}) {
        const response = await fetch(path, {...options, headers});
        const body = await response.json();
        document.querySelector("#status").textContent = JSON.stringify(body, null, 2);
      }
      async function log(event_type, fields = {}) {
        await send("/events", {method: "POST", body: JSON.stringify({event_type, ...fields})});
      }
      document.querySelector("#balance").onclick = async () => {
        await log("click", {target: "balance"});
        await send(`/balance/${principalId}`);
      };
      document.querySelector("#external").onclick = async () => {
        await log("click", {target: "external_content"});
        await send("/external-content");
      };
      document.querySelector("#pay").onclick = async () => {
        await log("click", {target: "merchant_payment"});
        await send("/merchant-payment", {
          method: "POST",
          body: JSON.stringify({
            principal_id: principalId, amount: 1180, payee: "FRESHMART",
            merchant_category: "grocery"
          })
        });
      };
      window.addEventListener("load", () => log("page_view", {page: "home", dwell_ms: 0}));
    </script>
  </body>
</html>
